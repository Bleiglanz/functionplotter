<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riemann Zeta Function</title>
    <link rel="stylesheet" href="/src/zeta.css" />
  </head>
  <body>
    <header>
      <h1>ζ(x) = Σ<sub>k=1</sub><sup>∞</sup> 1/k<sup>x</sup> for x &gt; 1</h1>
      <a class="home" href="./index.html">← All topics</a>
    </header>

    <main>
      <form id="controls" autocomplete="off">
        <fieldset class="count">
          <legend>Terms in the partial sum</legend>
          <label for="n">n</label>
          <input id="nSlider" type="range" min="0" max="3" step="0.01" aria-label="n slider (logarithmic)" />
          <input id="n" type="number" min="1" max="10000" step="1" />
          <span class="hint">S<sub>n</sub>(x) = 1 + 1/2<sup>x</sup> + … + 1/n<sup>x</sup>; the slider is logarithmic, 1 to 1000</span>
        </fieldset>

        <div class="view">
          <label class="field">
            <span>x from 1 to</span>
            <input id="xMax" type="number" min="1.5" step="any" />
          </label>
          <label class="field">
            <span>y from 0 to</span>
            <input id="yMax" type="number" min="1.5" step="any" />
          </label>
          <button id="reset" type="button">Reset</button>
        </div>
      </form>

      <figure id="chart">
        <figcaption>
          <span id="formula"></span>
          <span id="hover"></span>
        </figcaption>
        <svg tabindex="0" role="img"></svg>
        <p class="legend">
          <i class="key zeta"></i> ζ(x) <i class="key partial"></i> S<sub>n</sub>(x) <i class="key gap"></i> tail ζ(x) − S<sub>n</sub>(x)
        </p>
      </figure>

      <section id="facts" aria-live="polite">
        <h2>Properties</h2>
        <dl></dl>
      </section>
    </main>

    <script type="module" src="/src/zeta.js"></script>
  </body>
</html>
