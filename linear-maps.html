<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linear Maps in 2D</title>
    <link rel="stylesheet" href="/src/linear-maps.css" />
  </head>
  <body>
    <header>
      <h1>Linear maps: \(A\begin{pmatrix} x \\ y \end{pmatrix} = x\,Ae_1 + y\,Ae_2\)</h1>
      <a class="home" href="./index.html">← All topics</a>
    </header>

    <main>
      <form id="controls" autocomplete="off">
        <fieldset class="matrix">
          <legend>The matrix \(A\) (or drag \(Ae_1\) and \(Ae_2\) in the chart)</legend>
          <span class="paren left" aria-hidden="true"></span>
          <input id="a" type="number" step="0.05" aria-label="a, row 1 column 1" />
          <input id="b" type="number" step="0.05" aria-label="b, row 1 column 2" />
          <input id="c" type="number" step="0.05" aria-label="c, row 2 column 1" />
          <input id="d" type="number" step="0.05" aria-label="d, row 2 column 2" />
          <span class="paren right" aria-hidden="true"></span>
        </fieldset>

        <label class="field">
          <span>Example</span>
          <select id="preset">
            <option value="">Choose…</option>
          </select>
        </label>

        <fieldset class="count">
          <legend>From the identity (\(t = 0\)) to \(A\) (\(t = 1\))</legend>
          <label for="t">\(t\)</label>
          <input id="tSlider" type="range" min="0" max="1" step="0.01" aria-label="t slider" />
          <input id="t" type="number" min="0" max="1" step="0.01" />
        </fieldset>

        <button id="play" type="button" aria-pressed="false">▶ Apply \(A\) step by step</button>

        <p id="status" role="status"></p>
      </form>

      <figure id="chart">
        <figcaption>
          <span id="formula"></span>
          <span id="hover" class="readout"></span>
        </figcaption>
        <svg tabindex="0" role="img"></svg>
        <p class="legend">
          <i class="key e1"></i> \(Ae_1\), the first column
          <i class="key e2"></i> \(Ae_2\), the second column
          <i class="key square"></i> image of the unit square
          <i class="key grid"></i> image of the grid
        </p>
      </figure>

      <section id="facts" aria-live="polite">
        <h2>What the picture says</h2>
        <dl></dl>
      </section>
    </main>

    <script type="module" src="/src/linear-maps.js"></script>
  </body>
</html>
