<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundamental Theorem of Calculus</title>
    <link rel="stylesheet" href="/src/ftc.css" />
  </head>
  <body>
    <header>
      <h1>The fundamental theorem: \(F(x) = \int_a^x f(t)\,dt\) has \(F' = f\)</h1>
      <a class="home" href="./index.html">← All topics</a>
    </header>

    <main>
      <form id="controls" autocomplete="off">
        <label class="field">
          <span>\(f(x) =\)</span>
          <input id="expr" spellcheck="false" />
        </label>

        <label class="field">
          <span>Example</span>
          <select id="preset">
            <option value="">Choose…</option>
          </select>
        </label>

        <div class="pair">
          <label class="field">
            <span>Lower limit \(a\)</span>
            <input id="a" spellcheck="false" />
          </label>
          <fieldset class="range">
            <legend>View \(x\) from</legend>
            <input id="xMin" spellcheck="false" aria-label="x min" />
            <span>to</span>
            <input id="xMax" spellcheck="false" aria-label="x max" />
          </fieldset>
        </div>

        <fieldset class="count">
          <legend>Upper limit (or drag in either chart)</legend>
          <label for="b">\(b\)</label>
          <input id="bSlider" type="range" aria-label="b slider" />
          <input id="b" type="number" step="any" />
        </fieldset>

        <button id="play" type="button" aria-pressed="false">▶ Sweep \(b\) across the view</button>

        <fieldset class="riemann">
          <label class="check"><input id="rects" type="checkbox" /> Riemann rectangles on \([a, b]\)</label>
          <div class="count">
            <label for="n">\(n\)</label>
            <input id="nSlider" type="range" min="1" max="200" step="1" aria-label="n slider" />
            <input id="n" type="number" min="1" max="200" step="1" />
          </div>
          <div id="rules" class="segmented" role="radiogroup" aria-label="Sample point"></div>
        </fieldset>

        <p id="status" role="status"></p>
      </form>

      <figure id="antiChart">
        <figcaption>
          <span id="antiFormula"></span>
          <span id="antiHover" class="readout"></span>
        </figcaption>
        <svg tabindex="0" role="img"></svg>
      </figure>

      <figure id="chart">
        <figcaption>
          <span id="formula"></span>
          <span id="hover" class="readout"></span>
        </figcaption>
        <svg tabindex="0" role="img"></svg>
        <p class="legend"><i class="key pos"></i> adds to \(F(b)\) <i class="key neg"></i> subtracts from \(F(b)\)</p>
      </figure>

      <section id="facts" aria-live="polite">
        <h2>What the pictures say</h2>
        <dl></dl>
      </section>
    </main>

    <script type="module" src="/src/ftc.js"></script>
  </body>
</html>
