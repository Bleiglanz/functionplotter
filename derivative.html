<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secant to Tangent</title>
    <link rel="stylesheet" href="/src/derivative.css" />
  </head>
  <body>
    <header>
      <h1>From secant to tangent: \(f'(x_0) = \lim_{h \to 0} \frac{f(x_0 + h) - f(x_0)}{h}\)</h1>
      <a class="home" href="./index.html">← All topics</a>
    </header>

    <main>
      <form id="controls" autocomplete="off">
        <label class="field">
          <span>\(f(x) =\)</span>
          <input id="expr" spellcheck="false" />
        </label>

        <label class="field">
          <span>Example</span>
          <select id="preset">
            <option value="">Choose…</option>
          </select>
        </label>

        <fieldset class="range">
          <legend>View \(x\) from</legend>
          <input id="xMin" spellcheck="false" aria-label="x min" />
          <span>to</span>
          <input id="xMax" spellcheck="false" aria-label="x max" />
        </fieldset>

        <fieldset class="count">
          <legend>Point (or drag it in the chart)</legend>
          <label for="x0">\(x_0\)</label>
          <input id="x0Slider" type="range" aria-label="x₀ slider" />
          <input id="x0" type="number" step="any" />
        </fieldset>

        <fieldset class="count">
          <legend>Step (or drag the second point); the slider is logarithmic</legend>
          <label for="h">\(h\)</label>
          <input id="hSlider" type="range" min="-4" max="0" step="0.01" aria-label="h slider (logarithmic)" />
          <input id="h" type="number" step="any" />
        </fieldset>

        <div id="side" class="segmented sides" role="radiogroup" aria-label="Side of x₀">
          <label><input type="radio" name="side" value="1" /> \(h &gt; 0\), from the right</label>
          <label><input type="radio" name="side" value="-1" /> \(h &lt; 0\), from the left</label>
        </div>

        <button id="play" type="button" aria-pressed="false">▶ Let \(h \to 0\)</button>

        <p id="status" role="status"></p>
      </form>

      <figure id="chart">
        <figcaption>
          <span id="formula"></span>
          <span id="hover" class="readout"></span>
        </figcaption>
        <svg tabindex="0" role="img"></svg>
        <p class="legend">
          <i class="key secant"></i> secant through \(x_0\) and \(x_0 + h\)
          <i class="key tangent"></i> tangent at \(x_0\)
        </p>
      </figure>

      <figure id="slopeChart" class="chart-figure">
        <figcaption>
          <span>The secant slope as a function of \(h\), undefined at \(h = 0\)</span>
          <span id="slopeHover" class="readout"></span>
        </figcaption>
        <svg tabindex="0" role="img"></svg>
      </figure>

      <section id="facts" aria-live="polite">
        <h2>What the pictures say</h2>
        <dl></dl>
      </section>
    </main>

    <script type="module" src="/src/derivative.js"></script>
  </body>
</html>
